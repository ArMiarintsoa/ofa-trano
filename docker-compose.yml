version: "3.8"

services:
  # ── Exécuté régulièrement (manuellement ou par cron) ──────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: madarent_pipeline
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    # Lance entrypoint.sh : scraper.py → clean.py en séquence
    restart: "no"

  # ── Exécuté ponctuellement (entraînement du modèle) ───────────────────────
  # Lancer avec : docker-compose --profile train run --rm train
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: madarent_train
    command: ["python", "pipeline/train.py"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: "no"
    profiles:
      - train
